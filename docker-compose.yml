services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://luma:${POSTGRES_PASSWORD}@postgres:5432/luma
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:?set AI_CHAT_MODEL}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-}
      AI_DEEP_MODEL: ${AI_DEEP_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
